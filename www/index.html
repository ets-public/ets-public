<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<!-- Content Security Policy. script-src needs 'unsafe-inline' in the Android app only because Capacitor injects its native
     bridge as an inline script (the web build removes it). Scripts, styles and connections are locked to the app itself;
     the app also escapes everything it displays, so data can't turn into code. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self' blob:">
<title>Enhanced Training Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-START-->
<div class="app" id="app">
  <div class="modebar" role="group" aria-label="Section">
    <button class="mode-btn active" data-mode="inj" aria-pressed="true">Injections</button>
    <button class="mode-btn" data-mode="train" aria-pressed="false">Training</button>
    <button class="mode-btn" data-mode="health" aria-pressed="false">Health</button>
  </div>
  <header class="topbar">
    <div class="topbar-text">
      <p class="eyebrow"><span id="pageSub"></span><span id="pageMeta"></span></p>
      <h1 id="pageTitle">Today</h1>
    </div>
    <button class="icon-btn" id="topAction" hidden aria-label="Add"></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="restbar" id="restBar" hidden role="timer" aria-live="off">
    <div class="rest-fill" id="restFill"></div>
    <div class="rest-body">
      <div><div class="rest-label" id="restLabel" aria-live="polite">Rest</div><div class="rest-time" id="restTime">1:30</div></div>
      <div class="rest-btns"><button type="button" data-action="rest-minus" aria-label="15 seconds less">−15</button><button type="button" data-action="rest-plus" aria-label="15 seconds more">+15</button><button type="button" data-action="rest-skip">Skip</button></div>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="lockScreen" class="lock" hidden>
  <div class="lock-inner">
    <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    <p class="eyebrow" style="justify-content:center">Locked</p>
    <h1>Enhanced Training Studio</h1>
    <button class="btn btn-block" data-action="unlock">Unlock</button>
    <p id="lockMsg" class="form-err" role="alert"></p>
  </div>
</div>
<!--APP-END-->
<script src="build-info.js"></script>
<script src="app.js"></script>
</body>
</html>
